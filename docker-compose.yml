version: "3.9"

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: fieldflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fieldflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api-gateway:
    build: ./services/api-gateway
    container_name: fieldflow-api-gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      COMMAND_SERVICE_URL: http://command-service:3001
      READ_SERVICE_URL: http://read-service:3003
      AUTH_JWT_SECRET: supersecret
      INTERNAL_EVENT_SECRET: internal-secret
      WS_AUTH_TOKEN: ws-secret
      CORS_ORIGIN: http://localhost:3002
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 300
      LOG_LEVEL: info
    depends_on:
      - command-service
      - read-service

  nginx:
    image: nginx:1.27
    container_name: fieldflow-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api-gateway

  command-service:
    build: ./services/command-service
    container_name: fieldflow-command-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/fieldflow
      AUTH_JWT_SECRET: supersecret
      AUTH_TOKEN_TTL: 7d
      ALLOW_PUBLIC_REGISTER: "true"
      GATEWAY_URL: http://api-gateway:3000
      INTERNAL_EVENT_SECRET: internal-secret
      CORS_ORIGIN: http://localhost:3002
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 300
      LOG_LEVEL: info
    depends_on:
      - postgres

  db-migrate:
    build: ./services/command-service
    container_name: fieldflow-db-migrate
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/fieldflow
      MIGRATIONS_DIR: /app/infra/migrations
    volumes:
      - ./infra/migrations:/app/infra/migrations:ro
    command: ["npm", "run", "migrate"]
    depends_on:
      - postgres
    restart: "no"

  db-seed-dev:
    build: ./services/command-service
    container_name: fieldflow-db-seed-dev
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/fieldflow
      SEED_ENV: dev
      SEEDS_DIR: /app/infra/seeds
    volumes:
      - ./infra/seeds:/app/infra/seeds:ro
    command: ["npm", "run", "seed:dev"]
    depends_on:
      - db-migrate
    restart: "no"

  read-service:
    build: ./services/read-service
    container_name: fieldflow-read-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/fieldflow
      AUTH_JWT_SECRET: supersecret
      GATEWAY_URL: http://api-gateway:3000
      INTERNAL_EVENT_SECRET: internal-secret
      CORS_ORIGIN: http://localhost:3002
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 300
      LOG_LEVEL: info
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: fieldflow-frontend
    ports:
      - "3002:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_WS_URL: http://localhost:3000
      NEXT_PUBLIC_WS_TOKEN: ws-secret
    depends_on:
      - api-gateway

  db-backup:
    image: postgres:15
    container_name: fieldflow-db-backup
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: fieldflow
      BACKUP_INTERVAL_SECONDS: 86400
    volumes:
      - ./infra/postgres/backup.sh:/backup/backup.sh:ro
      - ./backups:/backups
    command: ["bash", "/backup/backup.sh"]
    depends_on:
      - postgres

volumes:
  postgres_data:
