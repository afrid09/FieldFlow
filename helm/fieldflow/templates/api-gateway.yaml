# Purpose: Helm template: api-gateway.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: api-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: {{ .Values.replicas.apiGateway }}
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: {{ .Values.images.apiGateway }}
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: COMMAND_SERVICE_URL
              value: http://command-service:3001
            - name: READ_SERVICE_URL
              value: http://read-service:3003
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fieldflow-secrets
                  key: AUTH_JWT_SECRET
            - name: INTERNAL_EVENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fieldflow-secrets
                  key: INTERNAL_EVENT_SECRET
            - name: WS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fieldflow-secrets
                  key: WS_AUTH_TOKEN
