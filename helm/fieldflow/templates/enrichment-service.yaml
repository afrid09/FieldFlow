# Purpose: Helm template: enrichment-service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enrichment-service
spec:
  replicas: {{ .Values.replicas.enrichmentService }}
  selector:
    matchLabels:
      app: enrichment-service
  template:
    metadata:
      labels:
        app: enrichment-service
    spec:
      containers:
        - name: enrichment-service
          image: {{ .Values.images.enrichmentService }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fieldflow-secrets
                  key: DATABASE_URL
