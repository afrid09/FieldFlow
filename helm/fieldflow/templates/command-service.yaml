apiVersion: v1
kind: Service
metadata:
  name: command-service
spec:
  ports:
    - port: 3001
      targetPort: 3001
  selector:
    app: command-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: command-service
spec:
  replicas: {{ .Values.replicas.commandService }}
  selector:
    matchLabels:
      app: command-service
  template:
    metadata:
      labels:
        app: command-service
    spec:
      containers:
        - name: command-service
          image: {{ .Values.images.commandService }}
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              value: postgres://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres:5432/{{ .Values.postgres.database }}
            - name: AUTH_JWT_SECRET
              value: {{ .Values.env.authJwtSecret | quote }}
            - name: GATEWAY_URL
              value: {{ .Values.env.gatewayUrl | quote }}
