# Purpose: Kubernetes manifest: ingress-prod.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fieldflow-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - REPLACE_ME.yourdomain.com
      secretName: fieldflow-tls
  rules:
    - host: REPLACE_ME.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 3000
