# Purpose: Kubernetes manifest: externalsecret-fieldflow.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fieldflow-secrets
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: fieldflow-secrets
    creationPolicy: Owner
  data:
    - secretKey: AUTH_JWT_SECRET
      remoteRef:
        key: fieldflow/app
        property: AUTH_JWT_SECRET
    - secretKey: INTERNAL_EVENT_SECRET
      remoteRef:
        key: fieldflow/app
        property: INTERNAL_EVENT_SECRET
    - secretKey: WS_AUTH_TOKEN
      remoteRef:
        key: fieldflow/app
        property: WS_AUTH_TOKEN
    - secretKey: DATABASE_URL
      remoteRef:
        key: fieldflow/app
        property: DATABASE_URL
