apiVersion: v1
kind: Service
metadata:
  name: command-service
spec:
  ports:
    - port: 3001
      targetPort: 3001
  selector:
    app: command-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: command-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: command-service
  template:
    metadata:
      labels:
        app: command-service
    spec:
      containers:
        - name: command-service
          image: fieldflow/command-service:latest
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fieldflow-secrets
                  key: DATABASE_URL
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fieldflow-secrets
                  key: AUTH_JWT_SECRET
            - name: AUTH_TOKEN_TTL
              value: 7d
            - name: ALLOW_PUBLIC_REGISTER
              value: "true"
            - name: GATEWAY_URL
              value: http://api-gateway:3000
