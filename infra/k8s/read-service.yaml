# Purpose: Kubernetes manifest: read-service.
apiVersion: v1
kind: Service
metadata:
  name: read-service
spec:
  ports:
    - port: 3003
      targetPort: 3003
  selector:
    app: read-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: read-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: read-service
  template:
    metadata:
      labels:
        app: read-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: read-service
          image: fieldflow/read-service:latest
          ports:
            - containerPort: 3003
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: "3003"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fieldflow-secrets
                  key: DATABASE_URL
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fieldflow-secrets
                  key: AUTH_JWT_SECRET
            - name: GATEWAY_URL
              value: http://api-gateway:3000
