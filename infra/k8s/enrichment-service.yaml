apiVersion: apps/v1
kind: Deployment
metadata:
  name: enrichment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enrichment-service
  template:
    metadata:
      labels:
        app: enrichment-service
    spec:
      containers:
        - name: enrichment-service
          image: fieldflow/enrichment-service:latest
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fieldflow-secrets
                  key: DATABASE_URL
