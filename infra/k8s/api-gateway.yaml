apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: api-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: api-gateway
          image: fieldflow/api-gateway:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: "3000"
            - name: COMMAND_SERVICE_URL
              value: http://command-service:3001
            - name: READ_SERVICE_URL
              value: http://read-service:3003
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fieldflow-secrets
                  key: AUTH_JWT_SECRET
            - name: INTERNAL_EVENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fieldflow-secrets
                  key: INTERNAL_EVENT_SECRET
            - name: WS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fieldflow-secrets
                  key: WS_AUTH_TOKEN
