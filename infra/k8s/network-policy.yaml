# Purpose: Kubernetes manifest: network-policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fieldflow-default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-gateway
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-service-to-postgres
spec:
  podSelector:
    matchLabels:
      app: postgres
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: command-service
        - podSelector:
            matchLabels:
              app: read-service
        - podSelector:
            matchLabels:
              app: enrichment-service
      ports:
        - protocol: TCP
          port: 5432
  policyTypes:
    - Ingress
