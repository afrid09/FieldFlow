global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:3000"]
  - job_name: command-service
    metrics_path: /metrics
    static_configs:
      - targets: ["command-service:3001"]
  - job_name: read-service
    metrics_path: /metrics
    static_configs:
      - targets: ["read-service:3003"]
